<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Champion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0F2B; --bg2:#131B45; --bg3:#1B2557;
    --gold:#E8B94A; --gold-dim:#8A6B2A; --gold-glow:rgba(232,185,74,.35);
    --teal:#2BB673; --red:#E2504A;
    --text:#F5F3EC; --text-muted:#A7ACC9;
    --border:rgba(232,185,74,.22);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, var(--bg3) 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter','Noto Sans Devanagari','Noto Sans Kannada',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(100px);z-index:-1;pointer-events:none;
    animation:floatBlob 20s ease-in-out infinite;}
  body::before{width:440px;height:440px;background:var(--gold);top:-140px;left:-120px;opacity:.28;}
  body::after{width:400px;height:400px;background:var(--teal);bottom:-160px;right:-100px;opacity:.22;animation-delay:-10s;}
  body.light::before{opacity:.16;}
  body.light::after{opacity:.12;}
  @keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(50px,35px) scale(1.18);}}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold);}
  body.light{
    --bg:#F3EFE3; --bg2:#FFFFFF; --bg3:#FBF8EF;
    --gold:#A9760F; --gold-dim:#C79A3E; --gold-glow:rgba(169,118,15,.25);
    --teal:#1E8E5A; --red:#C0392B;
    --text:#241E10; --text-muted:#6B6455;
    --border:rgba(169,118,15,.28);
  }
  body{transition:background .25s ease, color .25s ease;}
  #app{max-width:960px;margin:0 auto;padding:0 18px 60px;min-height:100vh;}
  .top-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:14px 18px;margin:0 -18px 26px;background:linear-gradient(180deg,rgba(10,15,43,.92),rgba(10,15,43,.72));
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .top-header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7;}
  body.light .top-header{background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.78));}
  .head-brand{display:flex;align-items:center;gap:8px;}
  .head-brand .diamond{width:11px;height:11px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 10px var(--gold-glow);}
  .head-brand span{font-size:14px;font-weight:800;letter-spacing:.06em;color:var(--gold);text-transform:uppercase;}
  .header-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .icon-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:8px;
    padding:8px 11px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:.12s;}
  .icon-btn:hover{border-color:var(--gold);color:var(--gold);}
  .icon-btn.theme-active{border-color:var(--gold);color:var(--gold);background:var(--gold-glow);}
  select.lang-select{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;font-family:inherit;font-size:13px;cursor:pointer;}
  .control-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 22px;}
  .crafted-badge{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);
    border-radius:12px;padding:8px 14px;}
  .crafted-avatar{width:38px;height:38px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.4);flex-shrink:0;}
  .crafted-text{display:flex;flex-direction:column;line-height:1.25;}
  .crafted-label{font-size:9px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;}
  .crafted-name{font-family:'Georgia',serif;font-style:italic;font-weight:700;font-size:16px;
    background:linear-gradient(90deg,var(--gold-dim),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .theme-segment{display:flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .seg-btn{background:var(--bg2);border:none;color:var(--text-muted);padding:9px 16px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:.15s;}
  .seg-btn.seg-active{background:var(--gold);color:#1B1200;}
  select.lang-select:focus{outline:none;border-color:var(--gold);}
  .admin-link{font-size:11px;color:var(--text-muted);opacity:.55;text-decoration:underline;cursor:pointer;
    background:none;border:none;font-family:inherit;padding:6px 2px;}
  .admin-link:hover{opacity:1;color:var(--gold);}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px;}
  .brand h1{background:linear-gradient(90deg,var(--gold-dim),var(--gold),#FFF6DC,var(--gold),var(--gold-dim));
    background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmerText 5s linear infinite;}
  body.light .brand h1{background:linear-gradient(90deg,#8A6316,#C79A3E,#3A2E10,#C79A3E,#8A6316);background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  @keyframes shimmerText{to{background-position:220% center;}}
  .brand .diamond{width:14px;height:14px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 14px var(--gold-glow);}
  .brand h1{font-size:20px;letter-spacing:.06em;margin:0;text-transform:uppercase;}
  .card{background:linear-gradient(180deg,var(--bg3),var(--bg2));border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative;overflow:hidden;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .center{text-align:center;}
  .muted{color:var(--text-muted);}
  h2.title{font-family:'Archivo Black',sans-serif;font-size:26px;margin:0 0 8px;letter-spacing:.01em;}
  p.sub{color:var(--text-muted);margin:0 0 26px;font-size:15px;line-height:1.6;}
  .btn{
    font-family:inherit;font-weight:700;font-size:15px;color:var(--bg);
    background:linear-gradient(180deg,#F4CE6E,var(--gold));
    border:none;border-radius:10px;padding:14px 26px;cursor:pointer;position:relative;overflow:hidden;
    box-shadow:0 8px 20px rgba(232,185,74,.25);transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn::after{content:'';position:absolute;top:0;left:-65%;width:35%;height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.6),transparent);
    transform:skewX(-20deg);transition:left .55s ease;}
  .btn:hover::after{left:130%;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(232,185,74,.35);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn:disabled::after{display:none;}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-dim);box-shadow:none;}
  .btn.ghost:hover{border-color:var(--gold);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row.center{justify-content:center;}

  .lang-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
  .lang-card{border:1.5px solid var(--border);border-radius:var(--radius);padding:26px 14px;text-align:center;cursor:pointer;background:var(--bg2);transition:.15s;}
  .lang-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .lang-card .big{font-size:26px;font-weight:800;margin-bottom:4px;}
  .lang-card .small{color:var(--text-muted);font-size:13px;}

  .field{margin-bottom:16px;text-align:left;}
  .field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:12px 14px;border-radius:9px;border:1.5px solid var(--border);
    background:var(--bg);color:var(--text);font-family:inherit;font-size:15px;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--gold);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px;}
  .cat-card{border:1.5px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;background:var(--bg2);display:flex;align-items:center;gap:12px;transition:.15s;}
  .cat-card:hover{border-color:var(--gold-dim);}
  .cat-card.sel{border-color:var(--gold);background:linear-gradient(180deg,rgba(232,185,74,.14),rgba(232,185,74,.04));}
  .cat-icon{width:40px;height:40px;border-radius:9px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--gold);flex-shrink:0;pointer-events:none;}
  .cat-card.sel .cat-icon{background:var(--gold);color:var(--bg);}
  .cat-name{font-size:14.5px;font-weight:600;pointer-events:none;}

  .game-wrap{display:grid;grid-template-columns:1fr 200px;gap:16px;}
  @media(max-width:760px){.game-wrap{grid-template-columns:1fr;}}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;color:var(--text-muted);flex-wrap:wrap;gap:8px;}
  .top-right{display:flex;align-items:center;gap:10px;}
  .points-now{color:var(--gold);font-family:'Archivo Black',sans-serif;font-size:20px;}
  .sound-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;font-family:inherit;}
  .sound-btn:hover{border-color:var(--gold);color:var(--gold);}
  .timer-wrap{margin-bottom:16px;}
  .timer-num{font-family:'Archivo Black',sans-serif;font-size:14px;color:var(--gold);margin-bottom:6px;letter-spacing:.02em;}
  .timer-num.urgent{color:var(--red);}
  .timer-bar-bg{width:100%;height:7px;border-radius:5px;background:var(--bg2);border:1px solid var(--border);overflow:hidden;}
  .timer-bar{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:width 1s linear;}
  .timer-bar.urgent{background:linear-gradient(90deg,#a83a35,var(--red));}
  .qimg{width:100%;height:170px;border-radius:10px;object-fit:cover;margin-bottom:16px;border:1px solid var(--border);pointer-events:none;}
  .qimg-placeholder{width:100%;height:170px;border-radius:10px;margin-bottom:16px;border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,.92);position:relative;overflow:hidden;pointer-events:none;}
  .qimg-placeholder::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px, transparent 1px);background-size:14px 14px;}
  .qimg-emoji{font-size:44px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));z-index:1;}
  .qimg-cat-label{font-family:'Archivo Black',sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;z-index:1;text-shadow:0 2px 4px rgba(0,0,0,.4);}
  .qtext{font-size:18px;font-weight:700;line-height:1.5;margin-bottom:20px;}
  .opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text);font-family:inherit;font-size:14.5px;cursor:pointer;transition:.12s;}
  .opt:hover:not(:disabled){border-color:var(--gold-dim);}
  .opt .tag{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--border);text-align:center;line-height:22px;font-size:12px;margin-right:10px;font-weight:700;color:var(--gold);pointer-events:none;}
  .opt.correct{border-color:var(--teal);background:rgba(43,182,115,.16);}
  .opt.wrong{border-color:var(--red);background:rgba(226,80,74,.16);}
  .opt.removed{opacity:.25;pointer-events:none;}
  .opt:disabled{cursor:default;}
  .correct-note{margin-top:2px;margin-bottom:14px;font-size:13.5px;color:var(--teal);font-weight:600;}

  .lifelines{display:flex;gap:10px;margin:18px 0 4px;flex-wrap:wrap;}
  .life-btn{flex:1;min-width:110px;padding:12px 8px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-align:center;}
  .life-btn:disabled{opacity:.3;cursor:not-allowed;}
  .life-btn:hover:not(:disabled){border-color:var(--gold);}

  .audience{margin:14px 0;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);}
  .aud-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;}
  .aud-bar-bg{flex:1;height:14px;border-radius:7px;background:var(--bg2);overflow:hidden;}
  .aud-bar{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));}
  .aud-pct{width:38px;text-align:right;color:var(--text-muted);}

  .ladder{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 10px;max-height:520px;overflow-y:auto;}
  .rung{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 6px;border-radius:6px;font-size:12px;margin-bottom:3px;color:var(--text-muted);}
  .rung .dm{width:7px;height:7px;background:var(--text-muted);opacity:.4;transform:rotate(45deg);flex-shrink:0;}
  .rung.done{color:var(--teal);}
  .rung.done .dm{background:var(--teal);opacity:1;}
  .rung.now{background:linear-gradient(90deg,rgba(232,185,74,.18),transparent);color:var(--gold);font-weight:800;}
  .rung.now .dm{background:var(--gold);opacity:1;box-shadow:0 0 8px var(--gold-glow);}
  @media(max-width:760px){.ladder{display:flex;overflow-x:auto;max-height:none;gap:6px;}.rung{flex-direction:column;white-space:nowrap;}}

  .score-big{font-family:'Archivo Black',sans-serif;font-size:44px;color:var(--gold);margin:6px 0 2px;}
  .badge{display:inline-block;padding:6px 16px;border-radius:20px;border:1px solid var(--gold-dim);color:var(--gold);font-size:13px;margin-top:8px;}
  .cert-preview{width:100%;max-width:640px;border-radius:12px;border:1px solid var(--border);margin:22px auto 6px;display:block;box-shadow:0 12px 30px rgba(0,0,0,.35);}
  .cert-building{height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);}
  .spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .note{font-size:12px;color:var(--text-muted);margin-top:14px;}

  .fail-banner{background:rgba(226,80,74,.12);border:1px solid rgba(226,80,74,.4);border-radius:10px;
    padding:14px 16px;margin:14px 0 4px;color:var(--text);font-size:14px;line-height:1.5;text-align:left;}
  .btn.pulse{animation:pulseGlow 1.6s ease-in-out infinite;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 8px 20px var(--gold-glow);}50%{box-shadow:0 10px 34px var(--gold-glow);}}

  .pass-field{max-width:320px;margin:0 auto 14px;}
  .cert-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:20px;text-align:left;}
  .cert-item{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .cert-item img{width:100%;border-radius:8px;margin-bottom:10px;border:1px solid var(--border);display:block;}
  .cert-item .ci-name{font-weight:800;font-size:15px;}
  .cert-item .ci-meta{font-size:12px;color:var(--text-muted);margin:2px 0;}
  .cert-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .cert-actions .btn{padding:8px 12px;font-size:12px;}
  .admin-stats{display:flex;gap:22px;justify-content:center;margin:6px 0 8px;flex-wrap:wrap;}
  .admin-stat{text-align:center;}
  .admin-stat b{display:block;font-family:'Archivo Black',sans-serif;font-size:24px;color:var(--gold);}
  .admin-stat span{font-size:12px;color:var(--text-muted);}
  .admin-section{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
  .admin-subhead{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:0 0 12px;text-align:center;}
  .accent-swatches{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .accent-swatch{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.3);transition:.15s;}
  .accent-swatch:hover{transform:scale(1.08);}
  .accent-swatch.accent-selected{border-color:var(--text);box-shadow:0 0 0 3px var(--gold-glow),0 2px 6px rgba(0,0,0,.3);}
  .lb-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .lb-row{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;}
  .lb-row.lb-top{border-color:var(--gold);background:linear-gradient(90deg,var(--gold-glow),transparent);}
  .lb-rank{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1B1200;font-weight:800;
    display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .lb-info{flex:1;min-width:0;}
  .lb-name{font-weight:700;font-size:14px;}
  .lb-meta{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lb-score{font-family:'Archivo Black',sans-serif;font-size:18px;color:var(--gold);flex-shrink:0;}
  .pranith-footer{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px 30px;opacity:.9;}
  .pranith-logo{width:64px;height:auto;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .pranith-text{font-size:11.5px;letter-spacing:.04em;color:var(--text-muted);}
  .pranith-text span{color:var(--gold);font-weight:700;}
</style>
</head>
<body>

function loadAccent(){
  try{ return localStorage.getItem(ACCENT_STORE_KEY) || 'gold'; }catch(e){ return 'gold'; }
}
function applyAccent(key){
  const p = ACCENT_PRESETS[key] || ACCENT_PRESETS.gold;
  const r = document.documentElement.style;
  r.setProperty('--gold', p.gold);
  r.setProperty('--gold-dim', p.dim);
  r.setProperty('--gold-glow', p.glow);
}
function setAccent(key){
  if(!ACCENT_PRESETS[key]) return;
  STATE.accent = key;
  try{ localStorage.setItem(ACCENT_STORE_KEY, key); }catch(e){}
  applyAccent(key);
  render();
}

/* ---------- Sound ---------- */
let audioCtx;
function beep(freq, dur){
  if(!STATE.soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.frequency.value = freq; o.type='sine';
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function toggleSound(){ STATE.soundOn=!STATE.soundOn; render(); }

/* ---------- Anti-cheat: leaving the tab/app ends the game ---------- */
document.addEventListener('visibilitychange', function(){
  if(document.hidden && STATE.status==='game' && !STATE.answered){
    STATE.score = STATE.correctStreakTier>=0 ? pointsForIndex(STATE.correctStreakTier) : 0;
    enterResult('left');
  }
});

/* ---------- Event delegation (no inline onclick, so this works everywhere) ---------- */
document.getElementById('app').addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');
  const value = el.getAttribute('data-value');
  if(action==='goLang'){ goLang(value); }
  else if(action==='gotoLang'){ STATE.status='userinfo'; render(); }
  else if(action==='gotoUserInfo'){ STATE.status='userinfo'; render(); }
  else if(action==='submitUserInfo'){ submitUserInfo(); }
  else if(action==='toggleCategory'){ toggleCategory(value); }
  else if(action==='toggleContinuous'){ toggleContinuous(); }
  else if(action==='startQuiz'){ startQuiz(value); }
  else if(action==='retryLoad'){ retryLoad(); }
  else if(action==='toggleSound'){ toggleSound(); }
  else if(action==='selectAnswer'){ selectAnswer(parseInt(value,10)); }
  else if(action==='fiftyFifty'){ useFiftyFifty(); }
  else if(action==='audience'){ useAudience(); }
  else if(action==='skip'){ useSkip(); }
  else if(action==='cashOut'){ cashOut(); }
  else if(action==='certificate'){ downloadCertificate(); }
  else if(action==='share'){ shareResult(); }
  else if(action==='playAgain'){ STATE.status='categories'; STATE.certDataUrl=null; resetQuizState(); render(); }
  else if(action==='retryCertificate'){ STATE.certBuilding=true; render(); withTimeout(buildCertificate(),4500).then(function(){ STATE.certBuilding=false; persistCertificateRecord(); render(); }); }
  else if(action==='gotoLeaderboard'){ STATE.status='leaderboard'; render(); }
  else if(action==='leaderboardBack'){ STATE.status='categories'; render(); }
  else if(action==='newSetup'){ STATE.status='userinfo'; render(); }
  else if(action==='setTheme'){ setTheme(value); }
  else if(action==='setAccent'){ setAccent(value); }
  else if(action==='gotoAdminLogin'){ STATE.preAdminStatus=STATE.status; STATE.adminError=''; STATE.status='admin-login'; render(); }
  else if(action==='submitAdminLogin'){ submitAdminLogin(); }
  else if(action==='adminBack'){ STATE.status = STATE.preAdminStatus || 'userinfo'; render(); }
  else if(action==='adminLogout'){ STATE.adminAuthed=false; STATE.status='userinfo'; render(); }
  else if(action==='adminDeleteCert'){ adminDeleteCert(value); }
  else if(action==='adminClearAll'){ adminClearAll(); }
});
document.getElementById('app').addEventListener('change', function(e){
  if(e.target && e.target.id==='lang-switch'){
    STATE.lang = e.target.value;
    render();
    if(STATE.status==='game' && STATE.currentQuestion){
      localizeQuestion(STATE.currentQuestion, STATE.lang);
    }
  }
});
document.getElementById('app').addEventListener('keydown', function(e){
  if(e.target && e.target.id==='admin-password-input' && e.key==='Enter'){ submitAdminLogin(); }
});

/* ---------- Screens ---------- */
function render(){
  const app = document.getElementById('app');
  document.body.className = STATE.theme==='light' ? 'light' : '';
  let html = renderHeader();
  html += '<div class="brand"><div class="diamond"></div><h1>'+t('brand')+'</h1><div class="diamond"></div></div>';
  if(STATE.status==='lang') html += screenLang();
  else if(STATE.status==='userinfo') html += screenUserInfo();
  else if(STATE.status==='categories') html += screenCategories();
  else if(STATE.status==='loading') html += screenLoading();
  else if(STATE.status==='error') html += screenError();
  else if(STATE.status==='game') html += screenGame();
  else if(STATE.status==='result') html += screenResult();
  else if(STATE.status==='admin-login') html += screenAdminLogin();
  else if(STATE.status==='admin') html += screenAdminPanel();
  else if(STATE.status==='leaderboard') html += screenLeaderboard();
  app.innerHTML = html;
}

/* ---------- Game logic ---------- */
function resetQuizState(){
  STATE.plan=[]; STATE.qIndex=0; STATE.fetchedCount=0; STATE.buffer=[];
  STATE.fiftyUsed=false; STATE.skipsLeft=3; STATE.removedOptions=null; STATE.audienceUsed=false; STATE.audienceData=null;
  STATE.currentQuestion=null; STATE.answered=false; STATE.selectedIdx=null; STATE.timedOut=false;
  clearQuestionTimer();
  STATE.correctStreakTier=-1; STATE.outcome=null;
  /* askedTexts is intentionally kept across replays so repeat plays keep getting fresh questions */
}

function startQuiz(mode){
  STATE.continuous = (mode === 'continuous');
  resetQuizState();
  if(STATE.continuous){
    STATE.plan = Array.from({length:20}, function(){ return CATEGORIES[Math.floor(Math.random()*CATEGORIES.length)].id; });
  } else {
    STATE.plan = Array.from({length:20}, function(){ return STATE.categories[Math.floor(Math.random()*STATE.categories.length)]; });
  }
  STATE.status='loading'; render();
  loadBatch(0,4).then(function(){ nextQuestion(); }).catch(function(){ STATE.status='error'; render(); });
}

function difficultyForIndex(i){ if(i<7) return 'easy'; if(i<14) return 'medium'; return 'hard'; }
function pointsForIndex(i){
  if(i<0) return 0;
  if(i<POINTS.length) return POINTS[i];
  return POINTS[POINTS.length-1] + (i-POINTS.length+1)*25;
}

function shuffleOptions(q){
  const idxs=[0,1,2,3];
  for(let i=idxs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=idxs[i]; idxs[i]=idxs[j]; idxs[j]=tmp; }
  const newOptions = idxs.map(function(i){return q.options[i];});
  const newCorrect = idxs.indexOf(q.correctIndex);
  return {question:q.question, options:newOptions, correctIndex:newCorrect};
}
function fallbackForSlice(slice, excludeArr){
  const used = new Set(excludeArr);
  return slice.map(function(catId){
    const bank = FALLBACK[catId] || FALLBACK.general;
    let pool = bank.filter(function(q){ return !used.has(q.question); });
    if(pool.length===0) pool = bank;
    const pick = pool[Math.floor(Math.random()*pool.length)];
    used.add(pick.question);
    const shuffled = shuffleOptions(pick);
    return { question: shuffled.question, options: shuffled.options, correctIndex: shuffled.correctIndex, category: catId, imageKeyword: catId };
  });
}

async function loadBatch(startIdx, count){
  STATE.lastBatchArgs = {startIdx:startIdx, count:count};
  if(STATE.continuous){
    while(STATE.plan.length < startIdx+count){
      STATE.plan.push(CATEGORIES[Math.floor(Math.random()*CATEGORIES.length)].id);
    }
  }
  const slice = STATE.plan.slice(startIdx, startIdx+count);
  if(slice.length===0) return;
  const catNames = slice.map(function(id){ const c=CATEGORIES.find(function(x){return x.id===id;}); return c?c.en:id; }).filter(function(v,i,a){return a.indexOf(v)===i;});
  const batchLang = STATE.lang;
  let questions; let isFallbackBatch = false;
  try{
    questions = await generateQuestions(slice.length, catNames, difficultyForIndex(startIdx), Array.from(STATE.askedTexts));
    if(!questions || questions.length===0) throw new Error('empty result');
  }catch(err){
    STATE.usedFallback = true; isFallbackBatch = true;
    questions = fallbackForSlice(slice, Array.from(STATE.askedTexts));
  }
  questions.forEach(function(q, idx){
    const catId = slice[idx] || slice[0];
    q.category = CATEGORIES.some(function(c){return c.id===q.category;}) ? q.category : catId;
    STATE.askedTexts.add(q.question);
    saveAskedTexts();
    q.image = null;
    q.origLang = isFallbackBatch ? 'en' : batchLang;
    q._cache = {}; q._cache[q.origLang] = {question:q.question, options:q.options.slice()};
    STATE.buffer.push(q);
    fetchImageForQuestion(q);
  });
  STATE.fetchedCount += questions.length;
}

async function generateQuestions(count, catNames, difficulty, exclude){
  const sys = 'You generate quiz questions for a trivia game show. Output ONLY a raw JSON array, no markdown fences, no commentary. Each element is an object with exactly: "question" (string), "options" (array of exactly 4 strings), "correctIndex" (integer 0-3), "category" (one of the provided category names, in English), "imageKeyword" (2-4 word English phrase for an illustrative photo search). Write the question and options entirely in ' + LANG_NAME_FOR_PROMPT[STATE.lang] + '. Ensure exactly one unambiguous correct option and factual accuracy.';
  const userMsg = 'Generate ' + count + ' ' + difficulty + '-difficulty quiz questions, mixing these categories: ' + catNames.join(', ') + '. Make them different in topic and phrasing from these already-asked questions: ' + (exclude.slice(-30).join(' | ') || 'none') + '. Variety token: ' + Math.random().toString(36).slice(2) + '.';
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1000, system: sys, messages:[{role:'user', content:userMsg}] })
  });
  if(!resp.ok) throw new Error('API error '+resp.status);
  const data = await resp.json();
  let text = (data.content||[]).map(function(b){ return b.text||''; }).join('');
  text = text.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(text);
  if(!Array.isArray(parsed)) throw new Error('bad format');
  return parsed.filter(function(q){ return q.question && Array.isArray(q.options) && q.options.length===4 && typeof q.correctIndex==='number'; });
}

/* Translate a single already-generated question into a new UI language on demand,
   so switching language mid-quiz updates the question on screen too. Results are
   cached per-question so flipping languages back and forth never re-calls the API. */
async function translateQA(questionText, options, targetLang){
  const sys = 'You translate trivia quiz content for a game show. Output ONLY a raw JSON object, no markdown fences, no commentary, in exactly this shape: {"question":"...","options":["...","...","...","..."]}. Translate into ' + LANG_NAME_FOR_PROMPT[targetLang] + '. Preserve the exact meaning and keep the 4 options in the same order — do not add, remove, or reorder them.';
  const userMsg = 'Question: ' + questionText + '\nOptions in order: ' + options.map(function(o,i){ return (i+1)+'. '+o; }).join(' | ');
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:500, system: sys, messages:[{role:'user', content:userMsg}] })
  });
  if(!resp.ok) throw new Error('translate API error '+resp.status);
  const data = await resp.json();
  let text2 = (data.content||[]).map(function(b){ return b.text||''; }).join('');
  text2 = text2.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(text2);
  if(!parsed || !parsed.question || !Array.isArray(parsed.options) || parsed.options.length!==4) throw new Error('bad translate format');
  return { question: parsed.question, options: parsed.options };
}
async function localizeQuestion(q, lang){
  if(!q) return;
  if(!q._cache) q._cache = {};
  if(!q.origLang) q.origLang = lang;
  if(!q._cache[q.origLang]) q._cache[q.origLang] = { question:q.question, options:q.options.slice() };
  if(q._cache[lang]){
    q.question = q._cache[lang].question; q.options = q._cache[lang].options.slice();
    if(STATE.currentQuestion===q) render();
    return;
  }
  const isVisible = STATE.currentQuestion===q;
  if(isVisible){ STATE.translating = true; render(); }
  try{
    const src = q._cache[q.origLang];
    const translated = await translateQA(src.question, src.options, lang);
    q._cache[lang] = translated;
    if(STATE.currentQuestion===q && STATE.lang===lang){
      q.question = translated.question; q.options = translated.options.slice();
    }
  }catch(e){ /* translation failed — keep showing the question in its original language */ }
  finally{
    if(isVisible){ STATE.translating = false; render(); }
  }
}

async function fetchImageForQuestion(q){
  try{
    const url = 'https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=' + encodeURIComponent(q.imageKeyword||q.question) + '&gsrlimit=1&prop=pageimages&pithumbsize=500&format=json&origin=*';
    const r = await fetch(url);
    const d = await r.json();
    const pages = d.query && d.query.pages;
    if(pages){
      const first = Object.values(pages)[0];
      if(first && first.thumbnail && first.thumbnail.source){
        q.image = first.thumbnail.source;
        if(STATE.currentQuestion === q && STATE.status==='game') render();
      }
    }
  }catch(e){}
}

const QUESTION_TIME = 25;

function clearQuestionTimer(){
  if(STATE.timerInterval){ clearInterval(STATE.timerInterval); STATE.timerInterval=null; }
  STATE.timeLeft = null;
}
function startQuestionTimer(){
  clearQuestionTimer();
  STATE.timeLeft = QUESTION_TIME;
  STATE.timerInterval = setInterval(function(){
    if(STATE.answered || STATE.status!=='game'){ clearQuestionTimer(); return; }
    STATE.timeLeft--;
    if(STATE.timeLeft<=0){
      clearQuestionTimer();
      handleTimeout();
      return;
    }
    render();
  }, 1000);
}
function handleTimeout(){
  if(STATE.answered) return;
  STATE.answered = true;
  STATE.selectedIdx = null; /* nothing chosen = wrong */
  STATE.timedOut = true;
  beep(220, 0.35);
  render();
  setTimeout(function(){ proceedAfterAnswer(false); }, 1900);
}

function nextQuestion(){
  clearQuestionTimer();
  if(STATE.buffer.length===0){
    if(!STATE.continuous && STATE.fetchedCount>=20){ STATE.status='result'; STATE.outcome='won'; render(); return; }
    STATE.status='loading'; render();
    const count = STATE.continuous ? 4 : Math.min(4,20-STATE.fetchedCount);
    loadBatch(STATE.fetchedCount, count).then(nextQuestion).catch(function(){ STATE.status='error'; render(); });
    return;
  }
  STATE.currentQuestion = STATE.buffer.shift();
  STATE.answered=false; STATE.selectedIdx=null; STATE.removedOptions=null; STATE.audienceData=null; STATE.timedOut=false;
  STATE.status='game'; render();
  startQuestionTimer();
  fetchImageForQuestion(STATE.currentQuestion);
  if(STATE.currentQuestion.origLang !== STATE.lang){ localizeQuestion(STATE.currentQuestion, STATE.lang); }
  const remainingNeeded = STATE.continuous ? 4 : 20-STATE.fetchedCount;
  if(STATE.buffer.length<2 && remainingNeeded>0 && !STATE._fetching){
    STATE._fetching=true;
    const count = STATE.continuous ? 4 : Math.min(4,remainingNeeded);
    loadBatch(STATE.fetchedCount, count).finally(function(){ STATE._fetching=false; });
  }
}

function selectAnswer(idx){
  if(STATE.answered) return;
  clearQuestionTimer();
  STATE.answered=true; STATE.selectedIdx=idx;
  const correct = idx===STATE.currentQuestion.correctIndex;
  beep(correct?880:220, correct?0.25:0.35);
  if(correct){ STATE.score = pointsForIndex(STATE.qIndex); STATE.correctStreakTier = STATE.qIndex; }
  render();
  setTimeout(function(){ proceedAfterAnswer(correct); }, 1900);
}
function proceedAfterAnswer(correct){
  if(!correct){ enterResult('lost'); return; }
  STATE.qIndex++;
  if(!STATE.continuous && STATE.qIndex>=20){ enterResult('won'); return; }
  nextQuestion();
}
function useFiftyFifty(){
  if(STATE.fiftyUsed||STATE.answered) return;
  const q=STATE.currentQuestion;
  const wrongIdx = [0,1,2,3].filter(function(i){return i!==q.correctIndex;});
  wrongIdx.sort(function(){return Math.random()-0.5;});
  STATE.removedOptions = wrongIdx.slice(0,2);
  STATE.fiftyUsed=true; render();
}
function useAudience(){
  if(STATE.audienceUsed||STATE.answered) return;
  const q=STATE.currentQuestion;
  const weights=[8,8,8,8];
  weights[q.correctIndex] += 40+Math.floor(Math.random()*30);
  for(let i=0;i<4;i++) if(i!==q.correctIndex) weights[i]+=Math.floor(Math.random()*12);
  const total=weights.reduce(function(a,b){return a+b;},0);
  STATE.audienceData = weights.map(function(w){ return Math.round(w/total*100); });
  STATE.audienceUsed=true; render();
}
function useSkip(){
  if(STATE.skipsLeft<=0||STATE.answered) return;
  STATE.skipsLeft--;
  nextQuestion();
}
function cashOut(){
  if(STATE.answered) return;
  clearQuestionTimer();
  STATE.score = STATE.correctStreakTier>=0 ? pointsForIndex(STATE.correctStreakTier) : 0;
  enterResult('cashout');
}

/* Called whenever the game ends (win, loss, banked score, or left the app).
   Shows the result screen immediately, then builds the certificate image
   in the background and re-renders once it's ready so it appears inline. */
function withTimeout(promise, ms){
  return new Promise(function(resolve){
    let done=false;
    const timer=setTimeout(function(){ if(!done){ done=true; resolve(); } }, ms);
    Promise.resolve(promise).then(function(){ if(!done){ done=true; clearTimeout(timer); resolve(); } })
      .catch(function(){ if(!done){ done=true; clearTimeout(timer); resolve(); } });
  });
}

async function enterResult(outcome){
  clearQuestionTimer();
  STATE.outcome = outcome;
  STATE.status = 'result';
  STATE.certDataUrl = null;
  STATE.certBuilding = true;
  render();
  await withTimeout(buildCertificate(), 4500); /* never let a slow connection freeze the result screen */
  STATE.certBuilding = false;
  persistCertificateRecord();
  if(STATE.status==='result') render();
}

/* ---------- Certificate ---------- */
function embossText(ctx, text, x, y, fontSize, weight, family, colorTop, colorBottom){
  ctx.font = weight+' '+fontSize+'px '+family;
  ctx.textAlign = 'center';
  // recessed shadow (gives raised depth)
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillText(text, x+2, y+3);
  // raised highlight edge
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText(text, x-1, y-1);
  // glossy metallic fill
  const g = ctx.createLinearGradient(0, y-fontSize*0.8, 0, y+fontSize*0.3);
  g.addColorStop(0, colorTop);
  g.addColorStop(0.5, colorBottom);
  g.addColorStop(1, colorTop);
  ctx.fillStyle=g;
  ctx.fillText(text, x, y);
  // fine definition stroke
  ctx.lineWidth=0.8;
  ctx.strokeStyle='rgba(0,0,0,0.3)';
  ctx.strokeText(text, x, y);
}

function loadImageAsync(src){
  return new Promise(function(resolve){
    const img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ resolve(null); };
    img.src = src;
  });
}

async function buildCertificate(){
  try{
    if(document.fonts && document.fonts.ready) await withTimeout(document.fonts.ready, 1500);
    const crestImg = await withTimeout(loadImageAsync(PRANITH_AVATAR), 1200);
    const w=1200,h=850;
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const ctx=c.getContext('2d');
    const grad = ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0,'#131B45'); grad.addColorStop(1,'#0A0F2B');
    ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);

    // glossy diagonal sheen across the whole card, like laminated card stock
    ctx.save();
    const sheen = ctx.createLinearGradient(0,0,w*0.55,h);
    sheen.addColorStop(0,'rgba(255,255,255,0.10)');
    sheen.addColorStop(0.4,'rgba(255,255,255,0.02)');
    sheen.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sheen;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(w*0.42,0); ctx.lineTo(w*0.16,h); ctx.lineTo(0,h); ctx.closePath(); ctx.fill();
    ctx.restore();

    // beveled metallic border (light-to-dark diagonal = embossed edge)
    const borderGrad = ctx.createLinearGradient(0,0,w,h);
    borderGrad.addColorStop(0,'#FFF3C4'); borderGrad.addColorStop(0.5,'#E8B94A'); borderGrad.addColorStop(1,'#8A6B2A');
    ctx.strokeStyle=borderGrad; ctx.lineWidth=7; ctx.strokeRect(30,30,w-60,h-60);
    ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1.5; ctx.strokeRect(38,38,w-76,h-76);
    ctx.strokeStyle='rgba(232,185,74,.5)'; ctx.lineWidth=1.5; ctx.strokeRect(48,48,w-96,h-96);

    embossText(ctx,'QUIZ CHAMPION', w/2, 104, 16, '700', 'Inter, sans-serif', '#FFF6DC', '#B8862F');
    embossText(ctx,'Certificate of Achievement', w/2, 162, 42, '900', 'Georgia, serif', '#FFF9E8', '#D9A93A');

    ctx.font='15px Inter, sans-serif'; ctx.fillStyle='#A7ACC9'; ctx.textAlign='center';
    ctx.fillText('This certifies that', w/2, 218);

    embossText(ctx, STATE.name || 'Player', w/2, 280, 48, '700', 'Georgia, serif', '#FFEFC2', '#C9971F');

    const meta = [];
    if(STATE.age) meta.push('Age: '+STATE.age);
    if(STATE.klass) meta.push('Class: '+STATE.klass);
    if(meta.length){
      ctx.font='14px Inter, sans-serif'; ctx.fillStyle='#A7ACC9'; ctx.textAlign='center';
      ctx.fillText(meta.join('     |     '), w/2, 308);
    }

    ctx.font='17px Inter, sans-serif'; ctx.fillStyle='#F5F3EC'; ctx.textAlign='center';
    ctx.fillText('has scored', w/2, 350);
    embossText(ctx, STATE.score + (STATE.continuous ? '' : ' / 500'), w/2, 400, 42, '900', 'Georgia, serif', '#FFF3C4', '#D9A93A');
    ctx.font='14px Inter, sans-serif'; ctx.fillStyle='#F5F3EC'; ctx.textAlign='center';
    ctx.fillText('points in the Quiz Champion Challenge', w/2, 424);

    embossText(ctx, tierName(STATE.score).toUpperCase(), w/2, 454, 16, '700', 'Inter, sans-serif', '#FFF6DC', '#B8862F');

    const catsPlayed = STATE.continuous ? 'All categories (Continuous Quiz)' : Array.from(new Set(STATE.categories)).map(function(id){ const c2=CATEGORIES.find(function(x){return x.id===id;}); return c2? c2.en : id; }).join(', ');
    ctx.font='13px Inter, sans-serif'; ctx.fillStyle='#A7ACC9';
    wrapText(ctx, 'Categories: '+catsPlayed, w/2, 484, 900, 18);

    const cy=558;
    for(let i=0;i<7;i++){
      const dx = w/2 - 180 + i*60;
      ctx.save();
      ctx.translate(dx,cy); ctx.rotate(Math.PI/4);
      const dgrad = ctx.createLinearGradient(-8,-8,8,8);
      dgrad.addColorStop(0, i<4?'#FFF3C4':'rgba(232,185,74,.3)');
      dgrad.addColorStop(1, i<4?'#B8862F':'rgba(138,107,42,.3)');
      ctx.fillStyle = dgrad;
      ctx.fillRect(-8,-8,16,16);
      ctx.restore();
    }

    // Pranith crest seal (real logo, wax-seal style)
    ctx.save();
    ctx.translate(w-170,h-160);
    ctx.beginPath(); ctx.arc(0,0,46,0,Math.PI*2); ctx.closePath();
    ctx.save(); ctx.clip();
    if(crestImg){ ctx.drawImage(crestImg, -46,-46,92,92); }
    else{
      const sealGrad = ctx.createRadialGradient(-10,-10,4,0,0,48);
      sealGrad.addColorStop(0,'#FFF6DC'); sealGrad.addColorStop(0.55,'#E8B94A'); sealGrad.addColorStop(1,'#8A6B2A');
      ctx.fillStyle=sealGrad; ctx.fillRect(-50,-50,100,100);
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.font='700 13px Inter, sans-serif'; ctx.textAlign='center';
      ctx.fillText('QC', 1, 6);
      ctx.fillStyle='#1B1200'; ctx.fillText('QC', 0, 5);
    }
    ctx.restore();
    ctx.lineWidth=3; ctx.strokeStyle='#E8B94A'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,50,0,Math.PI*2); ctx.lineWidth=1; ctx.strokeStyle='rgba(232,185,74,.5)'; ctx.stroke();
    ctx.restore();
    ctx.font='11px Inter, sans-serif'; ctx.fillStyle='#A7ACC9'; ctx.textAlign='center';
    ctx.fillText('Crafted by Pranith', w-170, h-98);

    const certId = 'QC-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2,6).toUpperCase();
    const dateStr = new Date().toLocaleDateString('en-IN', {year:'numeric',month:'long',day:'numeric'});
    ctx.font='13px Inter, sans-serif'; ctx.fillStyle='#A7ACC9';
    ctx.textAlign='left'; ctx.fillText('Date: '+dateStr, 100, h-85);
    ctx.fillText('Certificate ID: '+certId, 100, h-65);
    ctx.strokeStyle='rgba(232,185,74,.4)'; ctx.beginPath(); ctx.moveTo(100,h-105); ctx.lineTo(300,h-105); ctx.stroke();

    STATE.lastCertId = certId;
    STATE.certDataUrl = c.toDataURL('image/png');
  }catch(e){
    STATE.certDataUrl = null;
  }
}

/* ---------- Admin panel: certificate storage (saved locally in this browser) ---------- */
function persistCertificateRecord(){
  try{
    if(!STATE.certDataUrl) return;
    const list = loadCertificateList();
    list.push({
      id: STATE.lastCertId || ('QC-'+Date.now()),
      name: STATE.name || 'Player', age: STATE.age || '', klass: STATE.klass || '',
      score: STATE.score, tier: tierName(STATE.score),
      categories: STATE.continuous ? 'All categories (Continuous Quiz)' : Array.from(new Set(STATE.categories)).map(function(id){ const c=CATEGORIES.find(function(x){return x.id===id;}); return c?c.en:id; }).join(', '),
      outcome: STATE.outcome, lang: STATE.lang, date: new Date().toISOString(),
      image: STATE.certDataUrl
    });
    while(list.length>60){ list.shift(); }
    localStorage.setItem(ADMIN_STORE_KEY, JSON.stringify(list));
  }catch(e){ /* storage unavailable or quota exceeded - fail silently, game still works */ }
}
function loadCertificateList(){
  try{ return JSON.parse(localStorage.getItem(ADMIN_STORE_KEY) || '[]'); }
  catch(e){ return []; }
}
function submitAdminLogin(){
  const input = document.getElementById('admin-password-input');
  const val = input ? input.value : '';
  if(val === ADMIN_PASSWORD){ STATE.adminAuthed = true; STATE.adminError = ''; STATE.status = 'admin'; render(); }
  else { STATE.adminError = t('adminWrongPass'); render(); setTimeout(function(){ const i=document.getElementById('admin-password-input'); if(i) i.focus(); },0); }
}
function adminDeleteCert(id){
  let list = loadCertificateList();
  list = list.filter(function(r){ return r.id !== id; });
  try{ localStorage.setItem(ADMIN_STORE_KEY, JSON.stringify(list)); }catch(e){}
  render();
}
function adminClearAll(){
  if(!confirm(t('confirmClearAll'))) return;
  try{ localStorage.removeItem(ADMIN_STORE_KEY); }catch(e){}
  render();
}
function screenAdminLogin(){
  return '<div class="card center"><h2 class="title">'+t('adminLoginTitle')+'</h2><p class="sub">'+t('adminLoginSub')+'</p>'+
    '<div class="pass-field field"><label>'+t('adminPassword')+'</label><input id="admin-password-input" type="password" autocomplete="off"></div>'+
    (STATE.adminError ? '<div style="color:var(--red);font-size:13px;margin-bottom:12px;">'+STATE.adminError+'</div>' : '')+
    '<div class="row center"><button class="btn ghost" data-action="adminBack">'+t('back')+'</button>'+
    '<button class="btn" data-action="submitAdminLogin">'+t('adminEnter')+'</button></div></div>';
}
function screenAdminPanel(){
  if(!STATE.adminAuthed){ return screenAdminLogin(); }
  const list = loadCertificateList().slice().reverse();
  const uniquePlayers = new Set(list.map(function(r){ return (r.name||'').toLowerCase().trim(); })).size;
  const statsHtml = '<div class="admin-stats"><div class="admin-stat"><b>'+list.length+'</b><span>'+t('totalCerts')+'</span></div>'+
    '<div class="admin-stat"><b>'+uniquePlayers+'</b><span>'+t('totalPlayers')+'</span></div></div>';
  const itemsHtml = list.length===0 ? '<p class="muted center" style="margin-top:18px;">'+t('noCerts')+'</p>' :
    '<div class="cert-list">' + list.map(function(r){
      const dt = new Date(r.date);
      const dateStr = isNaN(dt) ? '' : dt.toLocaleDateString('en-IN', {year:'numeric',month:'short',day:'numeric'}) + ' · ' + dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
      return '<div class="cert-item">'+
        (r.image ? '<img src="'+r.image+'" alt="certificate">' : '')+
        '<div class="ci-name">'+r.name+'</div>'+
        '<div class="ci-meta">'+t('finalScoreLbl')+': '+r.score+'/500 · '+r.tier+'</div>'+
        '<div class="ci-meta">'+(r.klass?('Class/Level: '+r.klass+' · '):'')+(r.age?('Age: '+r.age):'')+'</div>'+
        '<div class="ci-meta">'+r.categories+'</div>'+
        '<div class="ci-meta">'+dateStr+'</div>'+
        '<div class="cert-actions">'+
        (r.image ? '<a class="btn ghost" href="'+r.image+'" target="_blank" rel="noopener">'+t('viewCert')+'</a>' : '')+
        '<button class="btn ghost" data-action="adminDeleteCert" data-value="'+r.id+'">'+t('deleteCert')+'</button>'+
        '</div></div>';
    }).join('') + '</div>';
  const accentHtml = '<div class="admin-section"><h3 class="admin-subhead">'+t('accentColor')+'</h3>'+
    '<div class="accent-swatches">' + Object.keys(ACCENT_PRESETS).map(function(k){
      const p = ACCENT_PRESETS[k];
      return '<button class="accent-swatch'+(STATE.accent===k?' accent-selected':'')+'" data-action="setAccent" data-value="'+k+'" '+
        'style="background:'+p.gold+';" title="'+p.label+'"></button>';
    }).join('') + '</div></div>';
  return '<div class="card"><h2 class="title center">'+t('adminPanelTitle')+'</h2><p class="sub center">'+t('adminPanelSub')+'</p>'+
    accentHtml + statsHtml + itemsHtml +
    '<div class="row center" style="margin-top:22px;">'+
    '<button class="btn ghost" data-action="adminClearAll">'+t('clearAll')+'</button>'+
    '<button class="btn ghost" data-action="adminLogout">'+t('logout')+'</button>'+
    '<button class="btn" data-action="adminBack">'+t('backHome')+'</button>'+
    '</div></div>';
}
function screenLeaderboard(){
  const list = loadCertificateList().slice().sort(function(a,b){ return (b.score||0)-(a.score||0); }).slice(0,10);
  const rowsHtml = list.length===0
    ? '<p class="muted center" style="margin:18px 0;">'+t('noScoresYet')+'</p>'
    : '<div class="lb-list">' + list.map(function(r,i){
        return '<div class="lb-row'+(i<3?' lb-top':'')+'"><div class="lb-rank">'+(i+1)+'</div>'+
          '<div class="lb-info"><div class="lb-name">'+(r.name||'Player')+'</div><div class="lb-meta">'+r.tier+' · '+r.categories+'</div></div>'+
          '<div class="lb-score">'+r.score+'</div></div>';
      }).join('') + '</div>';
  return '<div class="card"><h2 class="title center">🏆 '+t('highScores')+'</h2><p class="sub center">'+t('highScoresSub')+'</p>'+
    rowsHtml +
    '<div class="row center" style="margin-top:18px;"><button class="btn" data-action="leaderboardBack">'+t('backHome')+'</button></div></div>';
}

function downloadCertificate(){
  if(!STATE.certDataUrl) return;
  const link=document.createElement('a');
  link.download = (STATE.name||'quiz-champion')+'-certificate.png';
  link.href = STATE.certDataUrl;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
function wrapText(ctx,text,x,y,maxWidth,lineHeight){
  const words=text.split(' '); let line=''; let curY=y; ctx.textAlign='center';
  for(let n=0;n<words.length;n++){
    const test=line+words[n]+' ';
    if(ctx.measureText(test).width>maxWidth && n>0){ ctx.fillText(line,x,curY); line=words[n]+' '; curY+=lineHeight; }
    else line=test;
  }
  ctx.fillText(line,x,curY);
}

/* ---------- Boot ---------- */
applyAccent(STATE.accent);
render();
